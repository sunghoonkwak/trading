name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check src tests

      - name: Run mypy
        run: mypy

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=term-missing tests

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build test image
        run: docker build --target test -t trading-bot:test .

      - name: Run tests in image
        run: >-
          docker run --rm --user 1000:1000 -e HOME=/app
          --entrypoint python trading-bot:test -m pytest tests
