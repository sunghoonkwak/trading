name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check src tests

      - name: Run mypy
        run: mypy

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=term-missing tests

      - name: Audit runtime dependencies
        run: pip-audit -r requirements.txt

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t trading-bot:test .

      - name: Run tests in image
        run: >-
          docker run --rm --entrypoint sh trading-bot:test
          -c "mkdir -p /root/KIS_config &&
          cp templates/strategy_config.json /root/KIS_config/strategy_config.json &&
          python -m pip install --no-cache-dir -r requirements-dev.txt &&
          python -m pytest tests"
