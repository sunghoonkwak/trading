[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/infrastructure/kis/kis_api"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E402", "E701", "E722", "E731"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
explicit_package_bases = true
exclude = ["^src/infrastructure/kis/kis_api/"]

[tool.coverage.run]
source = ["src"]
omit = ["src/infrastructure/kis/kis_api/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = [
    "src/",
]
do_not_mutate = ["src/infrastructure/kis/kis_api/*"]
also_copy = [
    "scripts/",
]
pytest_add_cli_args = ["-o", "pythonpath=src"]
pytest_add_cli_args_test_selection = ["tests/"]
