[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["src/infrastructure/kis/kis_api"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E402", "E701", "E722", "E731"]

[tool.mypy]
python_version = "3.11"
files = [
    "src/core/__init__.py",
    "src/core/constants.py",
    "src/core/credentials.py",
    "src/core/event_pipe.py",
    "src/core/display.py",
    "src/core/http_defaults.py",
    "src/core/lock_manager.py",
    "src/application/runtime_service.py",
    "src/core/thread_comm.py",
    "src/core/trading_config.py",
    "src/interfaces/web/server.py",
    "src/utils/__init__.py",
    "src/utils/format_utils.py",
    "src/utils/logger.py",
    "src/utils/market_utils.py",
    "src/utils/price_utils.py",
    "src/data/__init__.py",
    "src/data/calculate_weights.py",
    "src/data/config_manager.py",
    "src/data/data_service.py",
    "src/data/gsheet.py",
    "src/domain/portfolio/processing.py",
    "src/domain/portfolio/scope.py",
    "src/toss/client.py",
    "src/toss/rate_limit.py",
    "src/toss/auth.py",
    "src/toss/get_orderbook.py",
    "src/toss/create_order.py",
    "src/toss/__init__.py",
    "src/toss/account_cache.py",
    "src/toss/get_accounts.py",
    "src/toss/get_holdings.py",
    "src/toss/get_buying_power.py",
    "src/toss/get_sellable_quantity.py",
    "src/toss/cancel_order.py",
    "src/toss/modify_order.py",
    "src/toss/get_order.py",
    "src/toss/get_orders.py",
    "src/toss/get_trades.py",
    "src/toss/get_commissions.py",
    "src/toss/get_candles.py",
    "src/toss/get_prices.py",
    "src/toss/get_price_limit.py",
    "src/toss/get_exchange_rate.py",
    "src/toss/get_kr_market_calendar.py",
    "src/toss/get_us_market_calendar.py",
    "src/interfaces/telegram/bot.py",
    "src/interfaces/telegram/utils.py",
    "src/interfaces/telegram/memo.py",
    "src/interfaces/telegram/system.py",
    "src/interfaces/telegram/portfolio.py",
    "src/interfaces/telegram/rebalancing.py",
    "src/interfaces/telegram/strategy.py",
    "src/interfaces/telegram/report_formatter.py",
    "src/interfaces/telegram/portfolio_formatter.py",
    "src/main.py",
    "src/interfaces/scheduler/runner.py",
    "src/interfaces/scheduler/order_runner.py",
    "src/interfaces/scheduler/portfolio_runner.py",
    "src/kis/__init__.py",
    "src/kis/constants.py",
    "src/kis/ws_parser.py",
    "src/application/strategy_execution.py",
    "src/broker/__init__.py",
    "src/broker/kis_broker.py",
    "src/broker/kis_rest_client.py",
    "src/broker/kis_ws_notifications.py",
    "src/broker/market_data.py",
    "src/broker/strategy_broker.py",
    "src/broker/toss_broker.py",
    "src/broker/toss_portfolio.py",
    "src/broker/order_admin.py",
    "src/broker/kis_worker.py",
    "src/broker/kis_ws_manager.py",
    "src/broker/kis_event_handler.py",
    "src/broker/kis_portfolio.py",
    "src/broker/kis_logger.py",
    "src/state/__init__.py",
    "src/state/system_state.py",
]
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
explicit_package_bases = true
exclude = ["^src/infrastructure/kis/kis_api/"]

[tool.coverage.run]
source = ["src"]
omit = ["src/infrastructure/kis/kis_api/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = ["src/strategy/", "src/broker/"]
also_copy = [
    "src/main.py",
    "src/core/",
    "src/data/",
    "src/kis/",
    "src/scheduler/",
    "src/state/",
    "src/telegram_bot/",
    "src/toss/",
    "src/utils/",
    "scripts/",
]
pytest_add_cli_args = ["-o", "pythonpath=src"]
pytest_add_cli_args_test_selection = ["tests/"]
